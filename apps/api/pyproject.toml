[project]
name = "foshol-lens-api"
version = "0.1.0"
description = "FosholLens API - Bangla crop advisory with LLM narrative and local TTS"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pillow>=11.0",
  "python-multipart>=0.0.12",
  "google-genai>=1.0",
  "openai>=1.54",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "huggingface-hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "S"]
# Bangla digits and punctuation are genuinely ambiguous to a Latin-centric
# checker; they are the point of this codebase, not a mistake.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# pytest is assertions all the way down.
"tests/*" = ["S101"]
# The district table is data; one row per line is the readable form.
"app/grounding/districts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
